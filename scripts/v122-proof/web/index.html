<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数字人第一阶段验证</title><link rel="stylesheet" href="style.css"></head>
<body>
<main>
  <header><p class="eyebrow">YUNCHUANG V122 · 本机验证</p><h1>录入人物和声音，生成验证录像</h1><p>素材只保存在这台电脑。完成后先检查本地 MP4，再进入直播接入。</p></header>
  <section class="step" data-step="person"><b>步骤 1</b><h2>录入人物视频</h2><p>正面半身、光线稳定，建议录制 20–60 秒。</p><video id="person-preview" playsinline controls muted></video><div class="actions"><button id="person-record">开始摄像头录制</button><label class="button secondary">选择已有视频<input id="person-file" type="file" accept="video/*" hidden></label><button id="person-stop" disabled>停止录制</button><button id="person-confirm" disabled>确认人物视频</button></div><p id="person-status" class="status">等待录入</p></section>
  <section class="step" data-step="voice"><b>步骤 2</b><h2>录入参考声音</h2><p>单人、无背景音乐，建议录制 10–30 秒。</p><meter id="voice-meter" min="0" max="1" value="0"></meter><audio id="voice-preview" controls></audio><div class="actions"><button id="voice-record">开始麦克风录音</button><label class="button secondary">选择已有WAV<input id="voice-file" type="file" accept="audio/wav,audio/*" hidden></label><button id="voice-stop" disabled>停止录音</button><button id="voice-confirm" disabled>确认参考声音</button></div><p id="voice-status" class="status">等待录入</p></section>
  <section class="step" data-step="text"><b>步骤 3</b><h2>填写文字</h2><label>参考录音逐字稿<textarea id="reference-transcript" rows="4" placeholder="必须与参考录音逐字一致"></textarea></label><label>新验证话术<textarea id="new-script" rows="4" placeholder="数字人最终要说的新内容"></textarea></label><button id="generate" class="primary" disabled>检查并开始生成</button></section>
  <section class="step" data-step="result"><b>步骤 4</b><h2>查看生成结果</h2><ol id="stages"><li data-stage="materials">素材检查</li><li data-stage="avatar">人物创建</li><li data-stage="voice">音色建立</li><li data-stage="tts">语音生成</li><li data-stage="drive">口型驱动</li><li data-stage="mp4">MP4合成</li></ol><h3>生成语音</h3><audio id="generated-wav" controls></audio><h3>最终录像</h3><video id="final-mp4" controls playsinline></video><fieldset><legend>人工效果评价</legend><label>人物可辨识度<select id="rating-person"><option>未评价</option><option>通过</option><option>不通过</option></select></label><label>声音相似度<select id="rating-voice"><option>未评价</option><option>通过</option><option>不通过</option></select></label><label>口型与音画同步<select id="rating-lip"><option>未评价</option><option>通过</option><option>不通过</option></select></label></fieldset></section>
  <footer><button id="delete-run" class="danger">删除本次素材</button><dialog id="delete-dialog"><p>确定删除本次录制、文字和生成结果吗？此操作不能撤销。</p><button id="delete-cancel">取消</button><button id="delete-confirm" class="danger">确认删除</button></dialog></footer>
</main><script src="app.js"></script>
</body></html>
