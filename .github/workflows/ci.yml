name: Local workspace checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: shuziren
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: shuziren_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shuziren -d shuziren_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Backend unit and PostgreSQL integration tests
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://shuziren:ci-only-database-password@127.0.0.1:5432/shuziren_test?sslmode=disable
        run: go test -race -count=1 ./...
      - name: Backend static checks
        working-directory: server
        run: go vet ./...
      - name: Frontend dependencies
        working-directory: web
        run: npm ci
      - name: Frontend tests and build
        working-directory: web
        run: |
          npm test
          npm run build
      - name: Prepare pinned CC0 model for 3D browser validation
        run: |
          python3 scripts/avatar3d_setup.py
          mkdir -p web/dist/avatar-assets
          cp web/public/avatar-assets/mpfb.glb web/dist/avatar-assets/mpfb.glb
      - name: TTS wrapper dependencies
        run: |
          python -m pip install --upgrade pip==26.2.2
          python -m pip install -r workers/tts/requirements-dev.txt
      - name: Worker boundaries and local diagnostic tools
        run: python -m pytest workers/tts workers/retrieval scripts/test_local_tools.py -q
      - name: Build backend for real browser transport acceptance
        working-directory: server
        run: go build -o ../build/shuziren ./cmd/server
      - name: Browser acceptance dependencies
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          if ! command -v psql >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client ffmpeg
          fi
      - name: Real WebRTC browser transport with isolated test media
        working-directory: tests/browser
        env:
          BROWSER_DATABASE_URL: postgres://shuziren:ci-only-database-password@127.0.0.1:5432/shuziren_test?sslmode=disable
        run: |
          npm test
          npm run test:business
      - name: Real 3D rendering, acoustic analysis and recorded audio/video
        env:
          AVATAR3D_BASE_URL: http://127.0.0.1:5174
          AVATAR3D_SOFTWARE_GL: '1'
        run: |
          node scripts/serve_avatar3d.mjs --port 5174 > /tmp/shuziren-avatar3d-ci.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time
          import urllib.request
          for attempt in range(20):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:5174/avatar3d', timeout=2) as response:
                      assert response.status == 200
                  break
              except OSError:
                  if attempt == 19:
                      raise
                  time.sleep(0.5)
          PY
          node tests/browser/avatar3d.cjs
      - name: Validate deployment configuration
        env:
          APP_TOKEN: ci-only-workspace-token-long-enough
          POSTGRES_PASSWORD: ci-only-database-password
        run: docker compose config --quiet

  container-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: shuziren-ci-${{ github.run_id }}-${{ github.run_attempt }}
      APP_TOKEN: ci-only-container-workspace-token
      POSTGRES_PASSWORD: ci-only-container-database-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start the actual local deployment
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Verify the container serves the UI and protected API
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = 'http://127.0.0.1:8765'
          with urllib.request.urlopen(base + '/healthz', timeout=10) as response:
              assert json.load(response)['status'] == 'ok'
          with urllib.request.urlopen(base + '/', timeout=10) as response:
              assert b'<div id="app"></div>' in response.read()
          try:
              urllib.request.urlopen(base + '/api/v1/status', timeout=10)
          except urllib.error.HTTPError as error:
              assert error.code == 401
          else:
              raise AssertionError('The API accepted an unauthenticated request')
          request = urllib.request.Request(base + '/api/v1/status', headers={'Authorization': 'Bearer ' + os.environ['APP_TOKEN']})
          with urllib.request.urlopen(request, timeout=10) as response:
              status = json.load(response)['data']
              assert status['version'] == '0.2.0'
              assert status['storage'] == 'postgresql'
              assert status['deepseek']['configured'] is False
          print('Container UI, PostgreSQL readiness, authentication, and status passed.')
          PY
      - name: Verify business data and audio through actual backup and restore
        run: python3 tests/backup_restore_smoke.py
      - name: Collect service status on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=80 app db
      - name: Remove isolated CI containers and volumes
        if: always()
        run: docker compose down -v
